<script>
const SUPABASE_URL = 'https://yqcnakgynctaxedrbpje.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WguxDRav85tZjqoUHmKQOg_2xhNY4x-';
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentView = 'home';
let products = [];
let myProducts = [];
let editingProductId = null;

// ============= UTILS =============
const toast = (msg, type = 'success') => {
  const colors = {
    success: 'bg-green-500',
    error: 'bg-red-500',
    info: 'bg-blue-500'
  };
  const id = Date.now();
  const el = document.createElement('div');
  el.id = `toast-${id}`;
  el.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg animate-slide-in flex items-center gap-2`;
  el.innerHTML = `
    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'xmark-circle' : 'info-circle'}"></i>
    <span>${msg}</span>
  `;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
};

const formatPrice = (price) => {
  return new Intl.NumberFormat('ar-SA', { style: 'currency', currency: 'SAR' }).format(price);
};

const formatDate = (date) => {
  return new Date(date).toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
};

// ============= AUTH =============
async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadUserProfile();
  }
  render();
}

async function loadUserProfile() {
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();
  
  if (data) {
    currentUser.profile = data;
  } else {
    // Create profile if doesn't exist
    await supabaseClient.from('profiles').insert({
      id: currentUser.id,
      email: currentUser.email,
      full_name: '',
      avatar_url: '',
      bio: '',
      social_links: {},
      buyers_count: 0
    });
    currentUser.profile = { full_name: '', avatar_url: '', bio: '', social_links: {}, buyers_count: 0 };
  }
}

async function signUp(email, password, fullName) {
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) {
    toast(error.message, 'error');
    return false;
  }
  if (data.user) {
    await supabaseClient.from('profiles').insert({
      id: data.user.id,
      email,
      full_name: fullName
    });
    toast('تم إنشاء الحساب بنجاح! تحقق من بريدك الإلكتروني', 'success');
    return true;
  }
}

async function signIn(email, password) {
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    toast(error.message, 'error');
    return false;
  }
  currentUser = data.user;
  await loadUserProfile();
  toast('مرحباً بك!', 'success');
  currentView = 'dashboard';
  render();
  return true;
}

async function signOut() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentView = 'home';
  render();
  toast('تم تسجيل الخروج', 'info');
}

async function resetPassword(email) {
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin
  });
  if (error) {
    toast(error.message, 'error');
    return false;
  }
  toast('تم إرسال رابط إعادة تعيين كلمة المرور', 'success');
  return true;
}

// ============= PRODUCTS =============
async function loadProducts() {
  const { data, error } = await supabaseClient
    .from('products')
    .select('*, profiles(full_name, avatar_url)')
    .order('created_at', { ascending: false });
  
  if (error) {
    console.error(error);
    return;
  }
  products = data || [];
}

async function loadMyProducts() {
  if (!currentUser) return;
  const { data, error } = await supabaseClient
    .from('products')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });
  
  if (error) {
    console.error(error);
    return;
  }
  myProducts = data || [];
}

async function uploadImages(files, productId) {
  const urls = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const fileExt = file.name.split('.').pop();
    const fileName = `${currentUser.id}/${productId}/${Date.now()}_${i}.${fileExt}`;
    
    const { data, error } = await supabaseClient.storage
      .from('products')
      .upload(fileName, file, {
        cacheControl: '3600',
        upsert: false
      });
    
    if (error) {
      console.error('Upload error:', error);
      toast('خطأ في رفع الصورة', 'error');
      continue;
    }
    
    const { data: { publicUrl } } = supabaseClient.storage
      .from('products')
      .getPublicUrl(fileName);
    
    urls.push(publicUrl);
  }
  return urls;
}

async function deleteImages(imageUrls) {
  if (!imageUrls || imageUrls.length === 0) return;
  const paths = imageUrls.map(url => {
    const parts = url.split('/products/');
    return parts[1];
  }).filter(Boolean);
  
  if (paths.length > 0) {
    await supabaseClient.storage.from('products').remove(paths);
  }
}

async function createProduct(title, description, price, imageFiles) {
  if (!currentUser) {
    toast('يجب تسجيل الدخول أولاً', 'error');
    return false;
  }
  
  const tempId = Date.now();
  const imageUrls = await uploadImages(imageFiles, tempId);
  
  const { data, error } = await supabaseClient.from('products').insert({
    user_id: currentUser.id,
    title,
    description,
    price: parseFloat(price),
    images: imageUrls,
    likes: 0,
    views: 0,
    rating: 0
  }).select().single();
  
  if (error) {
    toast(error.message, 'error');
    await deleteImages(imageUrls);
    return false;
  }
  
  toast('تم إضافة المنتج بنجاح', 'success');
  await loadProducts();
  await loadMyProducts();
  currentView = 'dashboard';
  render();
  return true;
}

async function updateProduct(productId, title, description, price, newImageFiles, existingImages, imagesToDelete) {
  if (!currentUser) {
    toast('يجب تسجيل الدخول أولاً', 'error');
    return false;
  }
  
  // Delete removed images
  if (imagesToDelete.length > 0) {
    await deleteImages(imagesToDelete);
  }
  
  // Upload new images
  const newImageUrls = await uploadImages(newImageFiles, productId);
  const allImages = [...existingImages, ...newImageUrls];
  
  const { error } = await supabaseClient
    .from('products')
    .update({
      title,
      description,
      price: parseFloat(price),
      images: allImages,
      updated_at: new Date().toISOString()
    })
    .eq('id', productId)
    .eq('user_id', currentUser.id);
  
  if (error) {
    toast(error.message, 'error');
    return false;
  }
  
  toast('تم تحديث المنتج بنجاح', 'success');
  editingProductId = null;
  await loadProducts();
  await loadMyProducts();
  render();
  return true;
}

async function deleteProduct(productId, images) {
  if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
  
  await deleteImages(images);
  
  const { error } = await supabaseClient
    .from('products')
    .delete()
    .eq('id', productId)
    .eq('user_id', currentUser.id);
  
  if (error) {
    toast(error.message, 'error');
    return;
  }
  
  toast('تم حذف المنتج', 'success');
  await loadProducts();
  await loadMyProducts();
  render();
}

async function likeProduct(productId) {
  if (!currentUser) {
    toast('يجب تسجيل الدخول للإعجاب', 'error');
    return;
  }
  
  const { data: product } = await supabaseClient
    .from('products')
    .select('likes')
    .eq('id', productId)
    .single();
  
  await supabaseClient
    .from('products')
    .update({ likes: (product.likes || 0) + 1 })
    .eq('id', productId);
  
  await loadProducts();
  render();
}

async function incrementViews(productId) {
  const { data: product } = await supabaseClient
    .from('products')
    .select('views')
    .eq('id', productId)
    .single();
  
  await supabaseClient
    .from('products')
    .update({ views: (product.views || 0) + 1 })
    .eq('id', productId);
}

// ============= PROFILE =============
async function updateProfile(updates, avatarFile) {
  let avatarUrl = currentUser.profile.avatar_url;
  
  if (avatarFile) {
    const fileExt = avatarFile.name.split('.').pop();
    const fileName = `${currentUser.id}/avatar.${fileExt}`;
    
    const { error: uploadError } = await supabaseClient.storage
      .from('avatars')
      .upload(fileName, avatarFile, { upsert: true });
    
    if (!uploadError) {
      const { data: { publicUrl } } = supabaseClient.storage
        .from('avatars')
        .getPublicUrl(fileName);
      avatarUrl = publicUrl;
    }
  }
  
  const { error } = await supabaseClient
    .from('profiles')
    .update({ ...updates, avatar_url: avatarUrl })
    .eq('id', currentUser.id);
  
  if (error) {
    toast(error.message, 'error');
    return false;
  }
  
  await loadUserProfile();
  toast('تم تحديث الملف الشخصي', 'success');
  render();
  return true;
}

function ProductCarousel({ images, productId }) {
  if (!images || images.length === 0) {
    return `<div class="aspect-16-9 bg-gray-200 dark:bg-gray-700 rounded-t-xl flex items-center justify-center">
      <i class="fas fa-image text-6xl text-gray-400"></i>
    </div>`;
  }
  
  return `
    <div class="relative group">
      <div id="carousel-${productId}" class="flex overflow-x-auto scrollbar-hide snap-x snap-mandatory carousel-snap aspect-16-9 rounded-t-xl bg-gray-100 dark:bg-gray-800">
        ${images.map((img, idx) => `
          <img src="${img}" 
               alt="Product ${idx + 1}" 
               class="carousel-item w-full h-full flex-shrink-0 object-cover"
               loading="lazy" />
        `).join('')}
      </div>
      ${images.length > 1 ? `
        <button onclick="scrollCarousel('${productId}', -1)"

        <button onclick="scrollCarousel('${productId}', 1)"

          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
          ${images.map((_, idx) => `
            <div class="w-2 h-2 rounded-full bg-white/50"></div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ============= RENDER =============
async function render() {
  await loadProducts();
  if (currentUser) await loadMyProducts();
  
  let content = '';
  
  switch(currentView) {
    case 'home':
      content = HomeView();
      break;
    case 'login':
    case 'signup':
    case 'forgot-password':
      content = AuthView();
      break;
    case 'dashboard':
      if (!currentUser) navigate('login');
      content = DashboardView();
      break;
    case 'create-product':
    case 'edit-product':
      if (!currentUser) navigate('login');
      content = ProductFormView();
      break;
    case 'profile':
      if (!currentUser) navigate('login');
      content = ProfileView();
      break;
    default:
      content = HomeView();
  }
  
  document.getElementById('app').innerHTML = `
    ${Navbar()}
    <main class="min-h-[calc(100vh-4rem)]">
      ${content}
    </main>
    ${Footer()}
  `;
}

// ============= EVENT HANDLERS =============
function navigate(view) {
  currentView = view;
  window.scrollTo(0, 0);
  render();
}

window.navigate = navigate;
window.signOut = signOut;
window.likeProduct = likeProduct;
window.deleteProduct = deleteProduct;
window.editProduct = (id) => {
  editingProductId = id;
  currentView = 'edit-product';
  render();
};

window.viewProduct = (id) => {
  incrementViews(id);
  toast('جاري فتح تفاصيل المنتج...', 'info');
};

window.shareProduct = (id) => {
  const url = `${window.location.origin}?product=${id}`;
  navigator.clipboard.writeText(url);
  toast('تم نسخ رابط المنتج', 'success');
};

window.scrollCarousel = (productId, direction) => {
  const carousel = document.getElementById(`carousel-${productId}`);
  if (carousel) {
    const scrollAmount = carousel.clientWidth;
    carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
  }
};

let selectedFiles = [];
let existingImagesToKeep = [];
let imagesToDelete = [];

window.previewImages = (event) => {
  const files = Array.from(event.target.files);
  selectedFiles = [...selectedFiles, ...files];
  const preview = document.getElementById('image-preview');
  
  preview.innerHTML = selectedFiles.map((file, idx) => `
    <div class="relative group">
      <img src="${URL.createObjectURL(file)}" class="w-full aspect-square object-cover rounded-lg">
      <button type="button" onclick="removeNewImage(${idx})" 
              class="absolute top-2 left-2 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition">
        <i class="fas fa-trash text-xs"></i>
      </button>
      <span class="absolute bottom-2 right-2 bg-black/50 text-white text-xs px-2 py-1 rounded">
        جديد
      </span>
    </div>
  `).join('');
};

window.removeNewImage = (idx) => {
  selectedFiles.splice(idx, 1);
  previewImages({ target: { files: selectedFiles } });
};

window.removeExistingImage = (url) => {
  imagesToDelete.push(url);
  existingImagesToKeep = existingImagesToKeep.filter(img => img !== url);
  const imgEl = event.target.closest('.relative');
  if (imgEl) imgEl.remove();
};

window.handleProductSubmit = async (e) => {
  e.preventDefault();
  const title = document.getElementById('product-title').value;
  const description = document.getElementById('product-description').value;
  const price = document.getElementById('product-price').value;
  
  if (editingProductId) {
    await updateProduct(editingProductId, title, description, price, selectedFiles, existingImagesToKeep, imagesToDelete);
    existingImagesToKeep = [];
    imagesToDelete = [];
    selectedFiles = [];
  } else {
    if (selectedFiles.length === 0) {
      toast('يجب رفع صورة واحدة على الأقل', 'error');
      return;
    }
    await createProduct(title, description, price, selectedFiles);
    selectedFiles = [];
  }
};

window.handleAuthSubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('auth-email')?.value;
  const password = document.getElementById('auth-password')?.value;
  const name = document.getElementById('auth-name')?.value;
  
  if (currentView === 'login') {
    await signIn(email, password);
  } else if (currentView === 'signup') {
    const success = await signUp(email, password, name);
    if (success) navigate('login');
  } else if (currentView === 'forgot-password') {
    await resetPassword(email);
  }
};

window.handleProfileSubmit = async (e) => {
  e.preventDefault();
  const avatarFile = document.getElementById('avatar-upload').files[0];
  const updates = {
    full_name: document.getElementById('profile-name').value,
    bio: document.getElementById('profile-bio').value,
    social_links: {
      twitter: document.getElementById('social-twitter').value,
      instagram: document.getElementById('social-instagram').value,
      facebook: document.getElementById('social-facebook').value,
      whatsapp: document.getElementById('social-whatsapp').value
    }
  };
  await updateProfile(updates, avatarFile);
};

// Initialize existing images when editing
document.addEventListener('DOMContentLoaded', () => {
  if (editingProductId) {
    const product = myProducts.find(p => p.id === editingProductId);
    if (product) existingImagesToKeep = [...product.images];
  }
});

// ============= INIT =============
checkAuth();

// Listen for auth changes
supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN') {
    currentUser = session.user;
    loadUserProfile().then(() => render());
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;
    render();
  }
});
</script>

DATABASE SCHEMA - قم بإنشاء هذه الجداول في Supabase SQL Editor:

-- 1. جدول الملفات الشخصية
CREATE TABLE profiles (

  title TEXT NOT NULL,

  price DECIMAL(10,2) NOT NULL,

  updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- 3. تفعيل RLS
ALTER TABLE profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE products ENABLE ROW LEVEL SECURITY;

-- 4. سياسات profiles
CREATE POLICY "Public profiles are viewable by everyone" ON profiles
  FOR SELECT USING (true);

CREATE POLICY "Users can update own profile" ON profiles
  FOR UPDATE USING (auth.uid() = id);

CREATE POLICY "Users can insert own profile" ON profiles
  FOR INSERT WITH CHECK (auth.uid() = id);

-- 5. سياسات products
CREATE POLICY "Products are viewable by everyone" ON products
  FOR SELECT USING (true);

CREATE POLICY "Users can insert own products" ON products

  FOR UPDATE USING (auth.uid() = user_id);

CREATE POLICY "Users can delete own products" ON products
  FOR DELETE USING (auth.uid() = user_id);

-- 7. سياسات Storage
CREATE POLICY "Anyone can view product images" ON storage.objects
  FOR SELECT USING (bucket_id = 'products');

CREATE POLICY "Authenticated users can upload product images" ON storage.objects
  FOR INSERT WITH CHECK (bucket_id = 'products' AND auth.role() = 'authenticated');

CREATE POLICY "Users can delete own product images" ON storage.objects
  FOR DELETE USING (bucket_id = 'products' AND auth.uid()::text = (storage.foldername(name))[1]);

  FOR SELECT USING (bucket_id = 'avatars');

  FOR UPDATE USING (bucket_id = 'avatars' AND auth.uid()::text = (storage.foldername(name))[1]);
