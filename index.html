<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safqa</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-dark {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .product-card {
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white">
    <!-- 
    ==================== FIREBASE SECURITY RULES ====================
    
    Firestore Rules:
    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        // Users can read all profiles but only edit their own
        match /users/{userId} {
          allow read: if true;
          allow create, update: if request.auth != null && request.auth.uid == userId;
        }
        
        // Products readable by all, writable by authenticated owners
        match /products/{productId} {
          allow read: if true;
          allow create: if request.auth != null && request.resource.data.sellerId == request.auth.uid;
          allow update, delete: if request.auth != null && resource.data.sellerId == request.auth.uid;
          
          // Comments subcollection
          match /comments/{commentId} {
            allow read: if true;
            allow create: if request.auth != null;
            allow delete: if request.auth != null && resource.data.userId == request.auth.uid;
          }
        }
        
        // Chats only between participants
        match /chats/{chatId} {
          allow read, write: if request.auth != null && request.auth.uid in resource.data.participants;
          allow create: if request.auth != null;
          
          match /messages/{messageId} {
            allow read: if request.auth != null && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.participants;
            allow create: if request.auth != null;
          }
        }
      }
    }
    
    Storage Rules:
    rules_version = '2';
    service firebase.storage {
      match /b/{bucket}/o {
        match /products/{userId}/{allPaths=**} {
          allow read: if true;
          allow write: if request.auth != null && request.auth.uid == userId;
        }
        match /profiles/{userId}/{allPaths=**} {
          allow read: if true;
          allow write: if request.auth != null && request.auth.uid == userId;
        }
      }
    }
    ================================================================
    -->

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
                    <img src="**ضع هنا رابط شعارك**" alt="Logo" class="w-10 h-10 rounded-lg object-cover" onerror="this.src='https://ui-avatars.com/api/?name=سوق&background=667eea&color=fff'">
                    <h1 class="text-2xl font-bold">Safqa.com</h1>
                </div>
                
                <div class="hidden md:flex items-center gap-6">
                    <button onclick="navigateTo('home')" class="hover:text-purple-200 transition">
                        <i class="ri-home-4-line ml-1"></i> الرئيسية
                    </button>
                    <button onclick="navigateTo('marketplace')" class="hover:text-purple-200 transition">
                        <i class="ri-store-2-line ml-1"></i> السوق
                    </button>
                    <div id="authButtons" class="flex gap-3">
                        <button onclick="showModal('loginModal')" class="glass px-4 py-2 rounded-lg hover:bg-white/20 transition">
                            تسجيل الدخول
                        </button>
                        <button onclick="showModal('signupModal')" class="bg-white text-purple-600 px-4 py-2 rounded-lg hover:bg-purple-50 transition font-semibold">
                            حساب جديد
                        </button>
                    </div>
                    <div id="userMenu" class="hidden relative">
                        <button onclick="toggleDropdown('userDropdown')" class="flex items-center gap-2 glass px-4 py-2 rounded-lg hover:bg-white/20 transition">
                            <img id="userAvatar" src="" class="w-8 h-8 rounded-full object-cover">
                            <span id="userName"></span>
                            <i class="ri-arrow-down-s-line"></i>
                        </button>
                        <div id="userDropdown" class="hidden absolute left-0 mt-2 w-48 glass-dark rounded-lg shadow-xl py-2 animate-slide-in">
                            <button onclick="navigateTo('dashboard')" class="w-full text-right px-4 py-2 hover:bg-white/10 transition">
                                <i class="ri-dashboard-line ml-2"></i> لوحة التحكم
                            </button>
                            <button onclick="navigateTo('profile')" class="w-full text-right px-4 py-2 hover:bg-white/10 transition">
                                <i class="ri-user-line ml-2"></i> الملف الشخصي
                            </button>
                            <button onclick="navigateTo('messages')" class="w-full text-right px-4 py-2 hover:bg-white/10 transition">
                                <i class="ri-message-3-line ml-2"></i> الرسائل
                            </button>
                            <hr class="my-2 border-white/20">
                            <button onclick="logout()" class="w-full text-right px-4 py-2 hover:bg-white/10 transition text-red-300">
                                <i class="ri-logout-box-line ml-2"></i> تسجيل الخروج
                            </button>
                        </div>
                    </div>
                </div>
                
                <button onclick="toggleMobileMenu()" class="md:hidden">
                    <i class="ri-menu-line text-2xl"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobileMenu" class="hidden md:hidden glass-dark border-t border-white/20">
            <div class="px-4 py-3 space-y-2">
                <button onclick="navigateTo('home'); toggleMobileMenu()" class="w-full text-right px-4 py-2 hover:bg-white/10 rounded-lg transition">
                    الرئيسية
                </button>
                <button onclick="navigateTo('marketplace'); toggleMobileMenu()" class="w-full text-right px-4 py-2 hover:bg-white/10 rounded-lg transition">
                    السوق
                </button>
                <div id="mobileAuthButtons">
                    <button onclick="showModal('loginModal'); toggleMobileMenu()" class="w-full text-right px-4 py-2 hover:bg-white/10 rounded-lg transition">
                        تسجيل الدخول
                    </button>
                    <button onclick="showModal('signupModal'); toggleMobileMenu()" class="w-full text-right px-4 py-2 bg-white text-purple-600 rounded-lg transition">
                        حساب جديد
                    </button>
                </div>
                <div id="mobileUserMenu" class="hidden space-y-2">
                    <button onclick="navigateTo('dashboard'); toggleMobileMenu()" class="w-full text-right px-4 py-2 hover:bg-white/10 rounded-lg transition">
                        لوحة التحكم
                    </button>
                    <button onclick="navigateTo('profile'); toggleMobileMenu()" class="w-full text-right px-4 py-2 hover:bg-white/10 rounded-lg transition">
                        الملف الشخصي
                    </button>
                    <button onclick="logout(); toggleMobileMenu()" class="w-full text-right px-4 py-2 hover:bg-white/10 rounded-lg transition text-red-300">
                        تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dynamic content will be injected here -->
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass rounded-2xl p-8 max-w-md w-full animate-slide-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
                <button onclick="hideModal('loginModal')" class="text-white/60 hover:text-white">
                    <i class="ri-close-line text-2xl"></i>
                </button>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block mb-2 text-sm">البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" required class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40" placeholder="example@email.com">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">كلمة المرور</label>
                        <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-white text-purple-600 py-3 rounded-lg font-semibold hover:bg-purple-50 transition">
                        دخول
                    </button>
                </div>
            </form>
            <p class="text-center mt-4 text-sm text-white/70">
                ليس لديك حساب؟ 
                <button onclick="hideModal('loginModal'); showModal('signupModal')" class="text-white font-semibold hover:underline">
                    سجل الآن
                </button>
            </p>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass rounded-2xl p-8 max-w-md w-full animate-slide-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">حساب جديد</h2>
                <button onclick="hideModal('signupModal')" class="text-white/60 hover:text-white">
                    <i class="ri-close-line text-2xl"></i>
                </button>
            </div>
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block mb-2 text-sm">الاسم الكامل</label>
                        <input type="text" id="signupName" required class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40" placeholder="محمد أحمد">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">البريد الإلكتروني</label>
                        <input type="email" id="signupEmail" required class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40" placeholder="example@email.com">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">كلمة المرور</label>
                        <input type="password" id="signupPassword" required minlength="6" class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40" placeholder="6 أحرف على الأقل">
                    </div>
                    <button type="submit" class="w-full bg-white text-purple-600 py-3 rounded-lg font-semibold hover:bg-purple-50 transition">
                        إنشاء حساب
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-96 glass-dark rounded-xl p-4 shadow-2xl z-50 animate-slide-in">
        <div class="flex items-center gap-3">
            <i id="toastIcon" class="text-2xl"></i>
            <div class="flex-1">
                <p id="toastMessage" class="font-semibold"></p>
            </div>
            <button onclick="hideToast()" class="text-white/60 hover:text-white">
                <i class="ri-close-line text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="loader"></div>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            updateProfile 
        } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            getDoc,
            doc, 
            query, 
            where, 
            orderBy, 
            onSnapshot,
            setDoc,
            updateDoc,
            serverTimestamp,
            deleteDoc
        } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
        import { 
            getStorage, 
            ref, 
            uploadBytes, 
            getDownloadURL 
        } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-storage.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBF47AnCk9WZFO_E1hpyEoMyYASDaESde4",
            authDomain: "your-souq.firebaseapp.com",
            projectId: "your-souq",
            storageBucket: "your-souq.firebasestorage.app",
            messagingSenderId: "446485737633",
            appId: "1:446485737633:web:f206c083f07ac3f11000e0",
            measurementId: "G-JE1Q6WYTBD"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Global State
        window.currentUser = null;
        window.currentUserData = null;
        window.products = [];
        window.currentPage = 'home';
        window.unsubscribeProducts = null;
        window.currentViewedUserId = null;

        // Categories
        const CATEGORIES = ['إلكترونيات', 'سيارات', 'منزلية', 'ملابس'];

        // Auth State Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    window.currentUserData = userDoc.data();
                }
                updateUIForAuth(true);
            } else {
                window.currentUser = null;
                window.currentUserData = null;
                updateUIForAuth(false);
            }
            
            // Check for product query param
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('product');
            if (productId) {
                navigateTo('product', productId);
            } else {
                navigateTo(window.currentPage);
            }
        });

        // Update UI Based on Auth State
        function updateUIForAuth(isLoggedIn) {
            document.getElementById('authButtons').classList.toggle('hidden', isLoggedIn);
            document.getElementById('userMenu').classList.toggle('hidden', !isLoggedIn);
            document.getElementById('mobileAuthButtons').classList.toggle('hidden', isLoggedIn);
            document.getElementById('mobileUserMenu').classList.toggle('hidden', !isLoggedIn);
            
            if (isLoggedIn && window.currentUser) {
                document.getElementById('userName').textContent = window.currentUser.displayName || window.currentUser.email.split('@')[0];
                document.getElementById('userAvatar').src = window.currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(window.currentUser.displayName || 'User')}&background=667eea&color=fff`;
            }
        }

        // Navigation
        window.navigateTo = (page, param = null) => {
            window.currentPage = page;
            const app = document.getElementById('app');
            
            // Unsubscribe from previous listeners
            if (window.unsubscribeProducts) {
                window.unsubscribeProducts();
                window.unsubscribeProducts = null;
            }
            
            switch(page) {
                case 'home':
                    renderHome();
                    break;
                case 'marketplace':
                    renderMarketplace();
                    break;
                case 'dashboard':
                    if (!window.currentUser) {
                        showToast('يجب تسجيل الدخول أولاً', 'error');
                        showModal('loginModal');
                        return;
                    }
                    renderDashboard();
                    break;
                case 'profile':
                    if (!window.currentUser) {
                        showToast('يجب تسجيل الدخول أولاً', 'error');
                        showModal('loginModal');
                        return;
                    }
                    renderProfile(window.currentUser.uid);
                    break;
                case 'product':
                    renderProductPage(param);
                    break;
                case 'messages':
                    if (!window.currentUser) {
                        showToast('يجب تسجيل الدخول أولاً', 'error');
                        showModal('loginModal');
                        return;
                    }
                    renderMessages();
                    break;
                case 'userProfile':
                    renderProfile(param);
                    break;
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Render Home Page
        function renderHome() {
            document.getElementById('app').innerHTML = `
                <div class="space-y-12">
                    <!-- Hero Section -->
                    <div class="glass rounded-3xl p-8 md:p-16 text-center">
                        <h1 class="text-4xl md:text-6xl font-extrabold mb-6">Sagqa</h1>
                        <p class="text-xl md:text-2xl text-white/80 mb-8">منصة البيع والشراء الأولى في ليبيا</p>
                        <div class="flex flex-wrap gap-4 justify-center">
                            <button onclick="navigateTo('marketplace')" class="bg-white text-purple-600 px-8 py-4 rounded-xl font-bold text-lg hover:bg-purple-50 transition">
                                <i class="ri-store-2-line ml-2"></i> تصفح السوق
                            </button>
                            ${window.currentUser ? `
                                <button onclick="navigateTo('dashboard')" class="glass px-8 py-4 rounded-xl font-bold text-lg hover:bg-white/20 transition">
                                    <i class="ri-add-circle-line ml-2"></i> أضف منتج
                                </button>
                            ` : `
                                <button onclick="showModal('signupModal')" class="glass px-8 py-4 rounded-xl font-bold text-lg hover:bg-white/20 transition">
                                    <i class="ri-user-add-line ml-2"></i> ابدأ البيع
                                </button>
                            `}
                        </div>
                    </div>

                    <!-- Categories -->
                    <div class="glass rounded-3xl p-8">
                        <h2 class="text-3xl font-bold mb-6 text-center">تسوق حسب الفئة</h2>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            ${CATEGORIES.map(cat => `
                                <button onclick="filterMarketplace('${cat}')" class="glass-dark rounded-2xl p-6 hover:bg-white/20 transition text-center">
                                    <i class="ri-${getCategoryIcon(cat)} text-4xl mb-3"></i>
                                    <p class="font-semibold">${cat}</p>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recent Products -->
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-3xl font-bold">أحدث المنتجات</h2>
                            <button onclick="navigateTo('marketplace')" class="text-purple-200 hover:text-white transition">
                                عرض الكل <i class="ri-arrow-left-line mr-1"></i>
                            </button>
                        </div>
                        <div id="recentProducts" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            <div class="col-span-full flex justify-center py-12">
                                <div class="loader"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            loadRecentProducts();
        }

        // Get Category Icon
        function getCategoryIcon(category) {
            const icons = {
                'إلكترونيات': 'smartphone-line',
                'سيارات': 'car-line',
                'منزلية': 'home-4-line',
                'ملابس': 't-shirt-2-line'
            };
            return icons[category] || 'shopping-bag-line';
        }

        // Load Recent Products
        async function loadRecentProducts() {
            const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
            const snapshot = await getDocs(q);
            const products = snapshot.docs.slice(0, 8).map(doc => ({ id: doc.id, ...doc.data() }));
            
            const container = document.getElementById('recentProducts');
            if (products.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-white/60">لا توجد منتجات بعد</p>';
                return;
            }
            
            container.innerHTML = products.map(p => renderProductCard(p)).join('');
        }

        // Render Marketplace
        function renderMarketplace() {
            document.getElementById('app').innerHTML = `
                <div class="space-y-6">
                    <div class="glass rounded-2xl p-6">
                        <h1 class="text-3xl font-bold mb-6">السوق</h1>
                        
                        <!-- Search & Filter -->
                        <div class="grid md:grid-cols-2 gap-4 mb-6">
                            <div class="relative">
                                <input type="text" id="searchInput" oninput="searchProducts()" placeholder="ابحث عن منتج..." 
                                    class="w-full px-4 py-3 pr-12 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40">
                                <i class="ri-search-line absolute left-4 top-1/2 -translate-y-1/2 text-white/60"></i>
                            </div>
                            <select id="categoryFilter" onchange="filterProducts()" 
                                class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 focus:outline-none focus:border-white/40">
                                <option value="" class="bg-purple-900">جميع الفئات</option>
                                ${CATEGORIES.map(cat => `<option value="${cat}" class="bg-purple-900">${cat}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <div class="col-span-full flex justify-center py-12">
                            <div class="loader"></div>
                        </div>
                    </div>
                </div>
            `;
            
            loadProducts();
        }

        // Load Products with Real-time
        function loadProducts() {
            const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
            
            window.unsubscribeProducts = onSnapshot(q, (snapshot) => {
                window.products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                displayProducts(window.products);
            });
        }

        // Display Products
        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-white/60 py-12">لا توجد منتجات</p>';
                return;
            }
            
            grid.innerHTML = products.map(p => renderProductCard(p)).join('');

                const description = document.getElementById('productDescription').value;

                const category = document.getElementById('productCategory').value;
                const team = document.getElementById('productTeam').value;
                
                // Upload image
                const imageRef = ref(storage, `products/${window.currentUser.uid}/${Date.now()}_${file.name}`);
                await uploadBytes(imageRef, file);
                const imageUrl = await getDownloadURL(imageRef);
                
                // Add product to Firestore
                await addDoc(collection(db, 'products'), {
                    title,
                    description,
                    price,
                    category,
                    team: team || null,
                    imageUrl,
                    sellerId: window.currentUser.uid,
                    sellerName: window.currentUser.displayName || window.currentUser.email.split('@')[0],
                    sellerEmail: window.currentUser.email,
                    createdAt: serverTimestamp()

                document.getElementById('imagePreview').classList.add('hidden');

            showLoading();
            
            try {
                const facebook = document.getElementById('editFacebook').value;
                const instagram = document.getElementById('editInstagram').value;
                const whatsapp = document.getElementById('editWhatsapp').value;
                const showSocial = document.getElementById('editShowSocial').checked;
                
                await updateDoc(doc(db, 'users', window.currentUser.uid), {
                    facebook: facebook || null,
                    instagram: instagram || null,
                    whatsapp: whatsapp || null,
                    showSocial
                });
                
                showToast('تم تحديث الملف الشخصي', 'success');
                hideModal('editProfileModal');
                renderProfile(window.currentUser.uid);
            } catch (error) {
                showToast('حدث خطأ في التحديث', 'error');
            } finally {
                hideLoading();
            }
        };

        // Render Messages
        function renderMessages() {
            document.getElementById('app').innerHTML = `
                <div class="glass rounded-2xl p-6">
                    <h1 class="text-3xl font-bold mb-6">الرسائل</h1>
                    <div id="chatsList" class="space-y-4">
                        <div class="flex justify-center py-12">
                            <div class="loader"></div>
                        </div>
                    </div>
                </div>
            `;
            
            loadChats();
        }

        // Load Chats
        async function loadChats() {
            const q = query(collection(db, 'chats'), where('participants', 'array-contains', window.currentUser.uid));
            
            onSnapshot(q, async (snapshot) => {
                const chats = [];
                for (const chatDoc of snapshot.docs) {
                    const chatData = chatDoc.data();
                    const otherUserId = chatData.participants.find(id => id !== window.currentUser.uid);
                    const otherUserDoc = await getDoc(doc(db, 'users', otherUserId));
                    const otherUserData = otherUserDoc.data();
                    
                    chats.push({
                        id: chatDoc.id,
                        ...chatData,
                        otherUser: otherUserData
                    });
                }
                
                const container = document.getElementById('chatsList');
                if (chats.length === 0) {
                    container.innerHTML = '<p class="text-center text-white/60 py-12">لا توجد محادثات بعد</p>';
                    return;
                }
                
                container.innerHTML = chats.map(chat => `
                    <div class="glass-dark rounded-xl p-4 hover:bg-white/10 transition cursor-pointer" onclick="openChat('${chat.id}')">
                        <div class="flex items-center gap-4">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(chat.otherUser?.displayName || 'User')}&background=667eea&color=fff" 
                                class="w-12 h-12 rounded-full">
                            <div class="flex-1">
                                <h3 class="font-semibold">${chat.otherUser?.displayName || 'مستخدم'}</h3>
                                <p class="text-sm text-white/60">اضغط للدردشة</p>
                            </div>
                            <i class="ri-arrow-left-s-line text-2xl text-white/40"></i>
                        </div>
                    </div>
                `).join('');
            });
        }

        // Auth Handlers
        window.handleSignup = async (e) => {
            e.preventDefault();
            showLoading();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                // Create user document
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    displayName: name,
                    email: email,
                    createdAt: serverTimestamp(),
                    showSocial: false
                });
                
                hideModal('signupModal');
                showToast('تم إنشاء الحساب بنجاح', 'success');
                document.getElementById('signupForm').reset();
            } catch (error) {
                showToast(getErrorMessage(error.code), 'error');
            } finally {
                hideLoading();
            }
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            showLoading();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                hideModal('loginModal');
                showToast('تم تسجيل الدخول بنجاح', 'success');
                document.getElementById('loginForm').reset();
            } catch (error) {
                showToast(getErrorMessage(error.code), 'error');
            } finally {
                hideLoading();
            }
        };

        window.logout = async () => {
            try {
                await signOut(auth);
                showToast('تم تسجيل الخروج', 'success');
                navigateTo('home');
            } catch (error) {
                showToast('حدث خطأ', 'error');
            }
        };

        // Helper Functions
        function getErrorMessage(code) {
            const errors = {
                'auth/email-already-in-use': 'البريد الإلكتروني مستخدم بالفعل',
                'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
                'auth/weak-password': 'كلمة المرور ضعيفة',
                'auth/user-not-found': 'المستخدم غير موجود',
                'auth/wrong-password': 'كلمة المرور خاطئة'
            };
            return errors[code] || 'حدث خطأ غير متوقع';
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return 'الآن';
            if (minutes < 60) return `منذ ${minutes} دقيقة`;
            if (hours < 24) return `منذ ${hours} ساعة`;
            if (days < 7) return `منذ ${days} يوم`;
            return date.toLocaleDateString('ar-LY');
        }

        // UI Helpers
        window.showModal = (id) => {
            document.getElementById(id).classList.remove('hidden');
        };

        window.hideModal = (id) => {
            document.getElementById(id).classList.add('hidden');
        };

        window.toggleDropdown = (id) => {
            document.getElementById(id).classList.toggle('hidden');
        };

        window.toggleMobileMenu = () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        };

        window.showToast = (message, type = 'info') => {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const messageEl = document.getElementById('toastMessage');
            
            messageEl.textContent = message;
            
            if (type === 'success') {
                icon.className = 'ri-checkbox-circle-line text-green-400';
            } else if (type === 'error') {
                icon.className = 'ri-error-warning-line text-red-400';
            } else {
                icon.className = 'ri-information-line text-blue-400';
            }
            
            toast.classList.remove('hidden');
            setTimeout(hideToast, 3000);
        };

        window.hideToast = () => {
            document.getElementById('toast').classList.add('hidden');
        };

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // Click outside to close dropdowns
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#userMenu')) {
                document.getElementById('userDropdown')?.classList.add('hidden');
            }
        });

        // Initialize
        console.log('سوقك الإلكتروني جاهز!');
    </script>
</body>
</html>
